<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Формула партнёрства — калькулятор</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf8f5;--card:#fff;--tx:#2a2326;--mut:#6f666a;--line:#e4dedb;--ac:#7a3a52;--acs:#f3e6ea;--ok:#2f7d4f;--warn:#b7791f;--bad:#b83a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1719;--card:#262124;--tx:#f0e9ec;--mut:#a99fa4;--line:#3a3337;--ac:#d98aa5;--acs:#3a2a31;--ok:#6fc28f;--warn:#e0b050;--bad:#e57373}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1719;--card:#262124;--tx:#f0e9ec;--mut:#a99fa4;--line:#3a3337;--ac:#d98aa5;--acs:#3a2a31;--ok:#6fc28f;--warn:#e0b050;--bad:#e57373}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:900px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
h2{font-size:1.15rem;margin:0 0 8px}
p{margin:0 0 8px}
.sub{color:var(--mut);margin-bottom:16px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:9px 12px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row b{display:inline}
.row small{display:block;color:var(--mut)}
.qb{width:22px;height:22px;border-radius:50%;border:1px solid var(--ac);background:var(--acs);color:var(--ac);font:600 .8rem/1 inherit;cursor:pointer;padding:0;vertical-align:middle;margin-left:4px}
.hint{background:var(--acs);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:6px 0 4px}
.hint div{margin-top:3px}
input[type=number],input[type=text]{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[type=number]{text-align:center}
.note{background:var(--acs);border-radius:10px;padding:10px 12px;font-size:.92rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.big{font-size:1.9rem;font-weight:700;line-height:1.1}
.lbl{color:var(--mut);font-size:.85rem}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--acs);color:var(--ac)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600}
td.n,th.n{text-align:center}
.q{border-left:4px solid var(--ac);padding-left:12px;margin-top:8px}
button.sec{padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer;margin-right:6px}
.m3{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0}
ol.st{padding-left:20px;margin:0}
ol.st li{margin-bottom:10px}
.gl{padding:10px 0;border-bottom:1px solid var(--line)}
.gl:last-child{border:0}
.gl .s{font-size:.88rem;color:var(--mut)}
code{background:var(--acs);padding:1px 5px;border-radius:5px;font-size:.9rem}
</style>
</head>
<body>
<div class="w">
<h1>Формула партнёрства</h1>
<p class="sub">Диагностика партнёрства для 2–5 партнёров по методике Анжелики Торгашовой. Новичкам: сначала откройте вкладку «Методика».</p>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<p style="margin-top:20px"><button class="sec" id="reset">Очистить все данные</button></p>
</div>
<script>
var L=['1–3','4–6','7–8','9–10'];
var PM={
ov:{n:'ОВП — вклад в общее дело',t:'Сколько сил и ответственности человек вкладывает в общее дело. Вы оцениваете и себя, и каждого партнёра по одной шкале.',s:['Участвую минимально, перекладываю ответственность, часто отсутствую','Делаю основное, но без инициативы, нужен контроль','Активно участвую, проявляю инициативу, отвечаю за свою зону','Вкладываюсь по максимуму, постоянно улучшаю, полностью отвечаю за результат']},
c:{n:'Ц — ценности',t:'Насколько одинаково партнёры видят цели и стратегию бизнеса.',s:['Постоянные споры о стратегии, разные цели','Общее видение есть, но серьёзные разногласия в методах','В основном едины, расхождения только в тактике','Полное единство в стратегии и ценностях']},
ek:{n:'ЭК — экологичность общения',t:'Насколько уважительно и конструктивно вы разговариваете, особенно когда не согласны.',s:['Конфликты, переход на личности, саботаж','Напряжённо, много недопонимания, но обсуждать можно','Конструктивный диалог, уважение, решаем проблемы','Быстро находим решения, идеи друг друга обогащают']},
sd:{n:'СД — договорённости',t:'Выполняется ли то, о чём вы условились. Можно ли полагаться на слово партнёров.',s:['Договорённости систематически нарушаются','Выполняются выборочно, нужен контроль','Предсказуемо выполняются, высокое доверие','Слово партнёра — закон, полное доверие']},
k:{n:'К — конфликтность',t:'Как часто и как разрушительно вы конфликтуете. ВНИМАНИЕ: шкала обратная, 1 — лучше всего, 10 — хуже всего.',s:['Конфликты редки, решаются быстро и конструктивно','Периодические споры, иногда мешают работе, но управляемы','Частые конфликты с переходом на личности, часть проблем не решена','Постоянная разрушительная конфронтация, работа парализована']},
u:{n:'У — удовлетворённость',t:'Насколько вы лично довольны этим партнёрством в целом.',s:['Разочарование, хочется выйти','Условно доволен, есть серьёзные оговорки и сомнения','Стабильно доволен, уверен в выборе партнёров','Полностью доволен, горжусь партнёрством']},
r:{n:'Р — результаты',t:'Что реально получилось: деньги, клиенты, рост, репутация.',s:['Кризис: убытки, потеря клиентов','Стагнация, работа в ноль, планы не выполнены','Стабильный рост, основные KPI выполнены','Бурный рост, планы перевыполнены']},
o:{n:'О — ожидания',t:'Чего вы хотели, когда начинали. Это исходная планка, а не то, чего хочется сейчас. Чем выше ожидания, тем строже оценка результата.',s:['Минимальные: сохранить ресурс, выжить','Умеренные: постепенный рост, стабильность','Высокие: быстрый рост, масштабирование','Максимальные: прорыв, лидерство на рынке']},
vf:{n:'ВФ — внешние факторы',t:'Помогает или мешает среда: рынок, конкуренты, регулирование. Единственный параметр со шкалой от −5 до +5.',L:['−5…−3','−2…0','+1…+3','+4…+5'],s:['Кризис в отрасли, жёсткая конкуренция, давление регуляторов','Условия сложные, но ситуация стабильна','Благоприятная среда, рост рынка, поддержка','Идеальные условия, мало конкурентов, помощь государства']}
};
var C=['c','ek','sd','k','u','r','o','vf'];
var LIM={vf:[-5,5]};
function lim(k){return LIM[k]||[1,10]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function scale(p){var l=p.L||L;return p.s.map(function(x,i){return'<div><b>'+l[i]+':</b> '+x+'</div>'}).join('')}
function hint(k){var p=PM[k];return'<div class="hint" hidden><p>'+p.t+'</p>'+scale(p)+'</div>'}
function fresh(){return{n:2,names:['Партнёр 1','Партнёр 2'],d:[{},{}]}}
var S=fresh(),tab='M';
try{var t=JSON.parse(localStorage.getItem('fp_v2'));if(t&&t.n>=2&&t.n<=5&&t.d&&t.names)S=t}catch(e){}
function save(){try{localStorage.setItem('fp_v2',JSON.stringify(S))}catch(e){}}
function nm(i){return esc(S.names[i]||'Партнёр '+(i+1))}
function anyData(){return S.d.some(function(d){return Object.keys(d).length>0})}
if(anyData())tab=0;
function mean(a){return a.reduce(function(s,x){return s+x},0)/a.length}
function isn(x){return typeof x==='number'&&!isNaN(x)}
function okP(i){var d=S.d[i];if(!isn(d.ovs))return false;for(var j=0;j<S.n;j++){if(j!==i&&!(d.ov&&isn(d.ov[j])))return false}return C.every(function(k){return isn(d[k])})}
function calc(v){var ikp=v.ov*v.c*v.ek*v.sd/(v.k*100)+v.vf/10,icr=(v.u/10)*(v.r/v.o);return{ikp:ikp,icr:icr,e:ikp!==0?icr/ikp:null}}
function indiv(i){var d=S.d[i],o=[];for(var j=0;j<S.n;j++){if(j!==i)o.push(d.ov[j])}var v={ov:d.ovs+mean(o)};C.forEach(function(k){v[k]=d[k]});return calc(v)}
function comb(){var ovs=[];for(var j=0;j<S.n;j++){var a=[S.d[j].ovs];for(var i=0;i<S.n;i++){if(i!==j)a.push(S.d[i].ov[j])}ovs.push(mean(a))}var v={ov:2*mean(ovs)};C.forEach(function(k){v[k]=mean(S.d.map(function(d){return d[k]}))});return calc(v)}
function lvlIkp(x){return x<3?['Критический','bad']:x<6?['Низкий','bad']:x<9?['Удовлетворительный','warn']:x<13?['Хороший','ok']:['Отличный','ok']}
function lvlIcr(x){return x<0.5?['Критический','bad']:x<0.8?['Низкий','bad']:x<=1.2?['Удовлетворительный','warn']:x<=2?['Хороший','ok']:['Отличный','ok']}
function lvlE(x){return x<0.5?'Сильный перекос в процессы':x<0.8?'Лёгкий перекос в процессы':x<=1.2?'Баланс':x<=2?'Лёгкий перекос в результат':'Сильный перекос в результат'}
function quad(a,b){
 if(a>=7&&b>=1)return['Квадрант 1: достаточно хорошее партнёрство','Поддерживайте практики, документируйте процессы, планируйте рост на 3–5 лет.'];
 if(a>=7)return['Квадрант 2: ладите, но результата нет','Причина обычно не в отношениях: проверьте бизнес-модель, рынок, цены, а также реалистичность ожиданий.'];
 if(b>=1)return['Квадрант 3: результат есть, но ценой отношений','Разделите зоны ответственности письменно, введите встречи только про отношения, договоритесь о способе решения споров, при необходимости привлеките медиатора.'];
 return['Квадрант 4: кризисное партнёрство','Честно решите: спасать или расходиться. Если спасать, привлеките внешнего медиатора и составьте план на 30–60–90 дней.'];
}
function f(x,d){return x.toFixed(d===undefined?2:d)}
function card(title,r){
 var h='<div class="card"><div class="lbl">'+title+'</div>';
 if(!r)return h+'<div class="lbl" style="padding-top:6px">Заполните все параметры, чтобы увидеть расчёт.</div></div>';
 var a=lvlIkp(r.ikp),b=lvlIcr(r.icr),q=quad(r.ikp,r.icr);
 return h+'<div class="m3"><div><div class="lbl">ИКП</div><div class="big">'+f(r.ikp)+'</div><span class="tag '+a[1]+'">'+a[0]+'</span></div>'+
 '<div><div class="lbl">ИЦР</div><div class="big">'+f(r.icr)+'</div><span class="tag '+b[1]+'">'+b[0]+'</span></div>'+
 '<div><div class="lbl">Э</div><div class="big">'+(r.e===null?'—':f(r.e,3))+'</div><span class="tag">'+(r.e===null?'ИКП = 0':lvlE(r.e))+'</span></div></div>'+
 '<div class="q"><b>'+q[0]+'</b><br><span class="lbl">'+q[1]+'</span></div></div>';
}
function zone(d){return d<=1?['Согласие','ok']:d<4?['Зона интереса','warn']:['Слепая зона','bad']}
function row(label,sub,key,val,pk){
 var l=lim(pk==='ov'?'':pk);
 return'<div class="row"><div><b>'+label+'</b><button class="qb" type="button" aria-label="Пояснение">?</button>'+(sub?'<small>'+sub+'</small>':'')+'</div><input type="number" inputmode="numeric" step="1" min="'+l[0]+'" max="'+l[1]+'" data-k="'+key+'" data-lim="'+l+'" placeholder="'+l[0]+'…'+l[1]+'" value="'+(isn(val)?val:'')+'"></div>'+hint(pk);
}
function partner(i){
 var d=S.d[i];
 var h='<div class="note">Заполняйте честно и независимо от других: не подсматривайте чужие ответы. Если непонятно, нажмите «?» рядом с параметром. Оценки от 1 до 10.</div>';
 h+='<div class="card"><label class="lbl" for="nm">Имя или обозначение партнёра</label><input type="text" id="nm" maxlength="30" value="'+esc(S.names[i]||'')+'"></div>';
 h+='<div class="card"><h2>1. Вклад в общее дело (ОВП)</h2>'+row('Мой вклад','Оцените себя','ovs',d.ovs,'ov');
 for(var j=0;j<S.n;j++){if(j!==i)h+=row('Вклад: '+nm(j),'Как вы оцениваете этого партнёра','ov:'+j,d.ov&&d.ov[j],'ov')}
 h+='</div><div class="card"><h2>2. Партнёрство в целом</h2>';
 C.forEach(function(k){h+=row(PM[k].n,k==='k'?'Шкала обратная: 1 — лучше всего':'',k,d[k],k)});
 h+='</div>';
 if(i===S.n-1&&S.n>2)h+='<button class="sec" data-del="1">Удалить этого партнёра</button>';
 return h;
}
function results(){
 var ok=[],miss=[];for(var i=0;i<S.n;i++){(okP(i)?ok:miss).push(i)}
 var h='<div class="note"><b>Как читать.</b> <b>ИКП</b> — качество ваших отношений и процессов (больше — лучше, от 7 хорошо). <b>ИЦР</b> — насколько результат оправдал ожидания (1,0 — ровно как ждали). <b>Э</b> — баланс между ними (около 1 — гармония). Подробнее на вкладке «Методика».</div>';
 if(miss.length)h+='<div class="note">Не до конца заполнено: '+miss.map(nm).join(', ')+'. Общий результат появится, когда заполнят все.</div>';
 h+=card('Общий результат ('+S.n+' '+(S.n<5?'партнёра':'партнёров')+')',miss.length?null:comb());
 h+='<h2 style="margin-top:16px">По каждому партнёру отдельно</h2><div class="grid">';
 for(var i=0;i<S.n;i++)h+=card(nm(i),okP(i)?indiv(i):null);
 h+='</div>';
 h+='<div class="card sc" style="margin-top:12px"><h2>Расхождения оценок</h2><p class="lbl">Зелёное — вы видите одинаково (разница 0–1). Жёлтое — зона интереса, спросите «что я вижу иначе?» (2–3). Красное — слепая зона (4 и больше), главная тема для разговора.</p><table><tr><th>Параметр</th>'+S.d.map(function(x,i){return'<th class="n">'+nm(i)+'</th>'}).join('')+'<th class="n">Разброс</th><th>Зона</th></tr>';
 C.forEach(function(k){
  var vals=S.d.map(function(d){return d[k]}),have=vals.filter(isn);
  h+='<tr><td>'+PM[k].n+'</td>'+vals.map(function(v){return'<td class="n">'+(isn(v)?v:'—')+'</td>'}).join('');
  if(have.length>1){var s=Math.max.apply(null,have)-Math.min.apply(null,have),z=zone(s);h+='<td class="n">'+f(s,s%1?1:0)+'</td><td class="'+z[1]+'">'+z[0]+'</td></tr>'}else h+='<td class="n">—</td><td></td></tr>';
 });
 h+='</table></div><div class="card sc"><h2>Вклад: самооценка и оценка другими</h2><table><tr><th>Партнёр</th><th class="n">Сам о себе</th><th class="n">Другие о нём (среднее)</th><th class="n">Разница</th><th>Зона</th></tr>';
 for(var j=0;j<S.n;j++){
  var me=S.d[j].ovs,o=[];for(var i=0;i<S.n;i++){if(i!==j&&S.d[i].ov&&isn(S.d[i].ov[j]))o.push(S.d[i].ov[j])}
  h+='<tr><td>'+nm(j)+'</td><td class="n">'+(isn(me)?me:'—')+'</td>';
  if(isn(me)&&o.length){var av=mean(o),s=Math.abs(me-av),z=zone(s);h+='<td class="n">'+f(av,1)+'</td><td class="n">'+f(s,1)+'</td><td class="'+z[1]+'">'+z[0]+'</td></tr>'}else h+='<td class="n">—</td><td class="n">—</td><td></td></tr>';
 }
 return h+'</table></div><div class="note">Если ИКП выше 13, показатель Э может быть очень низким и формально показывать «перекос в процессы», хотя партнёрство в отличном состоянии. В таком случае ориентируйтесь на квадрант. Цифры — это зеркало: главное — честный разговор и план на 30–45 дней с повторной диагностикой.</div>';
}
function method(){
 var h='<div class="card"><h2>Что это и зачем</h2><p>«Формула партнёрства» превращает ощущения («что-то у нас не так») в цифры, которые можно обсуждать. Партнёры независимо друг от друга оценивают 10 параметров, а сайт считает два индекса: <b>ИКП</b> (насколько здоровы ваши отношения и процессы) и <b>ИЦР</b> (насколько результат оправдал ожидания). Главная ценность — не итоговое число, а <b>расхождения в ваших оценках</b>: именно в них видны «слепые зоны».</p><p class="lbl">Подходит для стартапов с несколькими основателями, семейного бизнеса, компаний с долевым участием и любых деловых партнёров. Это диагностика, а не приговор.</p></div>';
 h+='<div class="card"><h2>Сценарий: как провести диагностику</h2><ol class="st">'+
 '<li><b>Договоритесь о правилах (5–10 мин).</b> Честность важнее вежливости; без обвинений; оценки остаются между вами; мнение каждого одинаково важно. Нужно 1–1,5 часа без отвлечений.</li>'+
 '<li><b>Каждый заполняет свою вкладку отдельно (30–40 мин).</b> Оценивайте реальное положение дел, а не желаемое. Сайт хранит данные в браузере этого устройства, поэтому заполняйте по очереди на одном устройстве и не смотрите чужие вкладки. Партнёров может быть от 2 до 5 (кнопка «+ Партнёр»).</li>'+
 '<li><b>Откройте «Результаты».</b> Посмотрите общие ИКП и ИЦР и свой квадрант.</li>'+
 '<li><b>Разберите расхождения.</b> Начните с красных строк (разница 4 и больше). Говорите о своих ощущениях («я чувствую, что мои идеи не замечают»), а не об оценке человека («ты меня не ценишь»). Не перебивайте и не обесценивайте чувства.</li>'+
 '<li><b>Договоритесь о действиях.</b> Выберите 1–2 конкретных шага на ближайшие 30–45 дней и назначьте дату повторной диагностики. Частота: в кризисе — каждые 30–45 дней, при стабильном партнёрстве — раз в 3–6 месяцев, для профилактики — 1–2 раза в год.</li></ol></div>';
 h+='<div class="card"><h2>Словарь: что оцениваем</h2><p class="lbl">Те же пояснения доступны по кнопке «?» рядом с каждым полем. Цифры — это ориентиры для баллов 1–3, 4–6, 7–8 и 9–10.</p>';
 ['ov'].concat(C).forEach(function(k){var p=PM[k];h+='<div class="gl"><b>'+p.n+'</b><p>'+p.t+'</p><div class="s">'+scale(p)+'</div></div>'});
 h+='</div><div class="card"><h2>Что означают результаты</h2>'+
 '<p><b>ИКП</b> (индекс качества партнёрства) — здоровье взаимодействия. Уровни: до 3 критический, 3–5,9 низкий, 6–8,9 удовлетворительный, 9–12,9 хороший, 13 и выше отличный.</p>'+
 '<p><b>ИЦР</b> (индекс ценности результата) — насколько результат соответствует ожиданиям и устраивает вас. Уровни: до 0,5 критический, 0,5–0,79 низкий, 0,8–1,2 удовлетворительный, 1,21–2,0 хороший, больше 2,0 отличный.</p>'+
 '<p><b>Э = ИЦР / ИКП</b> — баланс усилий и итога. Около 1 — гармония. Ниже 0,8 — процессы опережают результат. Выше 1,2 — результат достигнут ценой отношений (риск выгорания).</p>'+
 '<p><b>Квадрант</b> — общий диагноз по двум индексам. Граница: ИКП = 7, ИЦР = 1.</p>'+
 '<div class="gl"><b>Квадрант 1</b> (ИКП ≥ 7, ИЦР ≥ 1): хорошие отношения и хороший результат. Поддерживайте и масштабируйте.</div>'+
 '<div class="gl"><b>Квадрант 2</b> (ИКП ≥ 7, ИЦР &lt; 1): ладите, но результата нет. Ищите причину в бизнес-модели, рынке, ожиданиях.</div>'+
 '<div class="gl"><b>Квадрант 3</b> (ИКП &lt; 7, ИЦР ≥ 1): деньги есть, но отношения страдают. Срочно улучшайте процессы.</div>'+
 '<div class="gl"><b>Квадрант 4</b> (ИКП &lt; 7, ИЦР &lt; 1): кризис. Нужны радикальные меры и, возможно, внешний медиатор.</div></div>';
 h+='<div class="card"><h2>Как считается</h2><p><code>ИКП = (ОВП₁ + ОВП₂) × Ц × ЭК × СД / (К × 100) + ВФ / 10</code></p><p><code>ИЦР = (У / 10) × (Р / О)</code></p><p>Для двух партнёров расчёт точно по методике: ОВП каждого — среднее его самооценки и оценки другим партнёром, остальные параметры усредняются. <b>Для 3–5 партнёров</b> формула изначально не предназначена, поэтому здесь применена адаптация: ОВП каждого — среднее самооценки и оценок всех остальных, а в формулу вместо суммы двух ОВП подставляется удвоенное среднее ОВП всех партнёров (для двух партнёров это то же самое число). Остальные параметры усредняются по всем.</p></div>';
 h+='<p class="lbl">Методика «Формула партнёрства» принадлежит Анжелике Торгашовой, психологу, члену ОППЛ. Этот сайт — независимая реализация расчётов. Это инструмент самодиагностики, а не психологическое заключение. Данные хранятся только в вашем браузере и никуда не отправляются.</p>';
 return h;
}
function renderTabs(){
 var h='';
 for(var i=0;i<S.n;i++)h+='<button data-t="'+i+'" class="'+(tab===i?'on':'')+'">'+nm(i)+'</button>';
 if(S.n<5)h+='<button data-add="1" title="Добавить партнёра">+ Партнёр</button>';
 h+='<button data-t="R" class="'+(tab==='R'?'on':'')+'">Результаты</button><button data-t="M" class="'+(tab==='M'?'on':'')+'">Методика</button>';
 document.getElementById('tabs').innerHTML=h;
}
function render(){
 renderTabs();
 document.getElementById('view').innerHTML=tab==='M'?method():tab==='R'?results():partner(tab);
 window.scrollTo(0,0);
}
document.getElementById('tabs').addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.getAttribute('data-add')){S.n++;S.names.push('Партнёр '+S.n);S.d.push({});save();tab=S.n-1;render();return}
 var t=b.getAttribute('data-t');if(t===null)return;
 tab=(t==='R'||t==='M')?t:+t;render();
});
document.getElementById('view').addEventListener('click',function(e){
 var q=e.target.closest('.qb');
 if(q){var r=q.closest('.row'),h=r&&r.nextElementSibling;if(h&&h.className==='hint')h.hidden=!h.hidden;return}
 if(e.target.getAttribute('data-del')){
  if(confirm('Удалить последнего партнёра и его ответы?')){var x=S.n-1;S.n--;S.names.pop();S.d.pop();S.d.forEach(function(d){if(d.ov)delete d.ov[x]});save();tab=S.n-1;render()}
 }
});
document.getElementById('view').addEventListener('input',function(e){
 var t=e.target;
 if(t.id==='nm'){S.names[tab]=t.value;save();renderTabs();return}
 var k=t.getAttribute('data-k');if(!k||typeof tab!=='number')return;
 var l=t.getAttribute('data-lim').split(','),n=parseFloat(t.value),tg=S.d[tab],kk=k;
 if(k.indexOf('ov:')===0){tg=S.d[tab].ov=S.d[tab].ov||{};kk=k.slice(3)}
 if(isNaN(n))delete tg[kk];else tg[kk]=Math.min(+l[1],Math.max(+l[0],n));
 save();
});
document.getElementById('view').addEventListener('change',function(e){
 var t=e.target,k=t.getAttribute('data-k');if(!k||typeof tab!=='number')return;
 var v=k.indexOf('ov:')===0?(S.d[tab].ov||{})[k.slice(3)]:S.d[tab][k];t.value=isn(v)?v:'';
});
document.getElementById('reset').addEventListener('click',function(){
 if(confirm('Удалить все введённые данные и вернуть двух партнёров?')){S=fresh();save();tab='M';render()}
});
render();
</script>
